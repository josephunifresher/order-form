<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artwork Charge — Student Media Ltd</title>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Lato',Arial,sans-serif;background:#f5f3ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;}
#login-overlay{position:fixed;inset:0;background:rgba(80,20,160,.55);display:flex;align-items:center;justify-content:center;z-index:9999;}
#login-box{background:#fff;border-radius:16px;padding:36px 40px;width:380px;box-shadow:0 12px 48px rgba(0,0,0,.3);text-align:center;}
#login-box .logo{height:44px;margin-bottom:12px;}
#login-box h2{color:#702DD7;font-size:20px;margin-bottom:4px;}
#login-box p{font-size:12px;color:#888;margin-bottom:20px;}
.user-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.user-btn{background:#f3eeff;border:2px solid #D8CCF0;border-radius:30px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;color:#702DD7;}
.user-btn:hover,.user-btn.active{background:#702DD7;color:#fff;border-color:#702DD7;}
#login-pw{width:100%;border:1.5px solid #D8CCF0;border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:10px;}
#login-btn{width:100%;background:#702DD7;color:#fff;border:none;border-radius:30px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
#login-btn:hover{background:#5a1fad;}
#login-err{color:#e74c3c;font-size:12px;min-height:16px;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 20px rgba(112,45,215,.10);padding:32px;width:100%;max-width:620px;}
.page-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid #702DD7;}
.page-header img{height:42px;}
.page-header h1{font-size:20px;color:#702DD7;font-weight:700;}
.page-header p{font-size:12px;color:#888;margin-top:2px;}
.row{display:flex;gap:16px;flex-wrap:wrap;}
.field{margin-bottom:16px;flex:1;min-width:140px;}
.field label{display:block;font-size:12px;font-weight:700;color:#444;margin-bottom:5px;}
.field input,.field textarea{width:100%;padding:9px 11px;border:1.5px solid #D8CCF0;border-radius:8px;font-size:14px;font-family:inherit;}
.field input:focus,.field textarea:focus{outline:none;border-color:#702DD7;}
.calc{background:#f3eeff;border-radius:8px;padding:14px 18px;margin-bottom:16px;display:flex;gap:28px;}
.calc-item label{font-size:11px;color:#888;display:block;margin-bottom:3px;}
.calc-item .val{font-size:15px;font-weight:700;color:#702DD7;}
.calc-item.dim .val{color:#555;font-size:14px;}
.send-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.send-btn{background:#702DD7;color:#fff;border:none;border-radius:8px;padding:11px 26px;font-size:14px;font-weight:700;cursor:pointer;}
.send-btn:hover{background:#5a1fad;}
#send-status{font-size:13px;}
#user-badge{position:fixed;top:14px;right:18px;background:#702DD7;color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;display:none;}
</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <img class="logo" src="" alt="Unifresher">
    <h2>Artwork Charge</h2>
    <p>Student Media Ltd — please sign in</p>
    <div class="user-btns" id="user-btns"></div>
    <input type="password" id="login-pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="login-btn" onclick="doLogin()">Sign In</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="user-badge"></div>

<div class="card">
  <div class="page-header">
    <img src="" alt="Unifresher">
    <div>
      <h1>Artwork Charge</h1>
      <p>Student Media Ltd — notify Accounts of an artwork production charge</p>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>UNI Number *</label>
      <input type="text" id="ac-uni" placeholder="e.g. UNI02507" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    </div>
    <div class="field">
      <label>Company Name *</label>
      <input type="text" id="ac-company" placeholder="e.g. Bournemouth University">
    </div>
  </div>
  <div class="row">
    <div class="field" style="max-width:160px;">
      <label>Cost (ex VAT) £ *</label>
      <input type="number" id="ac-cost" value="150" min="0" step="0.01" oninput="updateTotals()">
    </div>
    <div class="field">
      <label>Description of Artwork *</label>
      <input type="text" id="ac-desc" placeholder="e.g. Banner design, logo creation…">
    </div>
  </div>

  <div class="calc">
    <div class="calc-item dim"><label>VAT (20%)</label><div class="val" id="ac-vat">£30.00</div></div>
    <div class="calc-item"><label>Total inc VAT</label><div class="val" id="ac-total">£180.00</div></div>
  </div>

  <div class="field">
    <label>Additional Notes <span style="color:#aaa;font-weight:400;">(optional)</span></label>
    <textarea id="ac-notes" rows="2" placeholder="Any extra details for Accounts…"></textarea>
  </div>

  <div class="send-row">
    <button class="send-btn" onclick="sendCharge()">📧 Send to Accounts</button>
    <span id="send-status"></span>
  </div>
</div>

<script>
var SB_URL = 'https://jyljjlaqogqpsdtvseqf.supabase.co';
var SB_KEY = 'sb_publishable_dookrCl78QbFd041YyuMYQ_uRZnSkvW';
var EMAILJS_SVC = 'service_a5nfqxx';
var EMAILJS_TPL = 'template_8h5woef';
var EMAILJS_KEY = 'X8v7VjuJWZ9mNRo23';
var ACCOUNTS_EMAIL = 'accounts@unifresher.co.uk';

function currentUser() {
  try { return JSON.parse(localStorage.getItem('uf_session')); } catch(e) { return null; }
}

function sbFetch(path, method, body) {
  var u = currentUser();
  var token = (u && u.access_token) ? u.access_token : SB_KEY;
  return fetch(SB_URL + '/rest/v1/' + path, {
    method: method || 'GET',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) { return r.status === 204 ? [] : r.json(); });
}

function sbAuth(path, body) {
  return fetch(SB_URL + '/auth/v1/' + path, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

function buildLoginBtns() {
  var wrap = document.getElementById('user-btns');
  if (!wrap) return;
  wrap.innerHTML = '<span style="font-size:11px;color:#aaa;">Loading…</span>';
  sbFetch('profiles?select=name,role&order=name').then(function(profiles) {
    wrap.innerHTML = '';
    (profiles || []).forEach(function(p) {
      var btn = document.createElement('button');
      btn.className = 'user-btn';
      btn.textContent = p.name;
      btn.dataset.name = p.name;
      btn.onclick = function() {
        wrap.querySelectorAll('.user-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('login-pw').focus();
      };
      wrap.appendChild(btn);
    });
  }).catch(function() {
    wrap.innerHTML = '<span style="color:#e74c3c;font-size:11px;">Could not load users</span>';
  });
}

function doLogin() {
  var activeBtn = document.querySelector('#user-btns .user-btn.active');
  var pw = (document.getElementById('login-pw') || {}).value || '';
  var err = document.getElementById('login-err');
  if (!activeBtn) { err.textContent = 'Please select a user'; return; }
  err.textContent = 'Signing in…';
  sbFetch('profiles?name=eq.' + encodeURIComponent(activeBtn.dataset.name) + '&select=email,name,role,initials')
    .then(function(rows) {
      if (!rows || !rows.length) { err.textContent = 'User not found'; return; }
      var profile = rows[0];
      return sbAuth('token?grant_type=password', { email: profile.email, password: pw })
        .then(function(data) {
          if (data.error || !data.access_token) { err.textContent = 'Incorrect password'; return; }
          localStorage.setItem('uf_session', JSON.stringify({
            id: data.user.id, name: profile.name, role: profile.role,
            initials: profile.initials || '', access_token: data.access_token,
            refresh_token: data.refresh_token
          }));
          showLoggedIn(profile.name);
        });
    }).catch(function() { err.textContent = 'Sign in failed — please try again'; });
}

function showLoggedIn(name) {
  var o = document.getElementById('login-overlay');
  if (o) o.style.display = 'none';
  var b = document.getElementById('user-badge');
  if (b) { b.textContent = '\u{1F464} ' + name; b.style.display = 'block'; }
}

function updateTotals() {
  var cost = parseFloat(document.getElementById('ac-cost').value) || 0;
  var fmt = function(n) { return '\u00A3' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
  document.getElementById('ac-vat').textContent = fmt(cost * 0.2);
  document.getElementById('ac-total').textContent = fmt(cost * 1.2);
}

function sendCharge() {
  var uni = (document.getElementById('ac-uni').value || '').trim();
  var company = (document.getElementById('ac-company').value || '').trim();
  var desc = (document.getElementById('ac-desc').value || '').trim();
  var cost = parseFloat(document.getElementById('ac-cost').value) || 0;
  var notes = (document.getElementById('ac-notes').value || '').trim();
  var statusEl = document.getElementById('send-status');
  var u = currentUser();
  var filledBy = u ? u.name : '—';
  var fmt = function(n) { return '\u00A3' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };

  statusEl.style.color = '#e74c3c';
  if (!uni) { statusEl.textContent = '\u26A0 UNI Number required'; return; }
  if (!company) { statusEl.textContent = '\u26A0 Company Name required'; return; }
  if (!desc) { statusEl.textContent = '\u26A0 Description required'; return; }
  if (!cost) { statusEl.textContent = '\u26A0 Cost must be greater than \u00A30'; return; }

  statusEl.style.color = '#888';
  statusEl.textContent = 'Sending…';

  var vat = cost * 0.2;
  var total = cost + vat;
  var msg = 'Artwork Charge Notification\n\n'
    + 'UNI: ' + uni + '\n'
    + 'Company: ' + company + '\n'
    + 'Description: ' + desc + '\n'
    + 'Cost (ex VAT): ' + fmt(cost) + '\n'
    + 'VAT (20%): ' + fmt(vat) + '\n'
    + 'Total inc VAT: ' + fmt(total)
    + (notes ? '\n\nNotes: ' + notes : '')
    + '\n\nSent by: ' + filledBy
    + '\nDate: ' + new Date().toLocaleString('en-GB');

  emailjs.init({ publicKey: EMAILJS_KEY });
  emailjs.send(EMAILJS_SVC, EMAILJS_TPL, {
    to_email: ACCOUNTS_EMAIL,
    subject: uni + ' \u2013 Artwork Charge \u2013 ' + company,
    message: msg,
    filled_by: filledBy,
    date_time: new Date().toLocaleString('en-GB'),
    form_url: location.href
  }).then(function() {
    statusEl.style.color = '#27ae60';
    statusEl.textContent = '\u2713 Sent to Accounts';
  }).catch(function() {
    statusEl.style.color = '#e74c3c';
    statusEl.textContent = '\u2717 Failed — please try again';
  });
}

// Init
(function() {
  var u = currentUser();
  if (u) {
    showLoggedIn(u.name);
  } else {
    buildLoginBtns();
  }
})();
</script>
</body>
</html>
